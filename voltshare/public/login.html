<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PlugMate — Sign In & Register</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&family=Google+Sans:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Roboto', 'Google Sans', 'sans-serif'],
            google: ['Google Sans', 'Roboto', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            googleBlue: '#1A73E8',
            googleBlueHover: '#1557B0',
            googleRed: '#EA4335',
            googleGreen: '#0F9D58',
            googleYellow: '#FBBC04',
            googleGray: '#5F6368',
            googleBorder: '#DADCE0'
          },
          boxShadow: {
            google: '0 2px 6px rgba(60,64,67, 0.3), 0 1px 2px rgba(60,64,67, 0.15)',
            googleCard: '0 4px 16px rgba(0,0,0,0.12)'
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gray-50 min-h-screen flex flex-col font-sans text-gray-800">

  <!-- Shared Navbar Mount -->
  <div id="voltNavbarMount"></div>

  <!-- Main Content -->
  <main class="flex-1 flex items-center justify-center p-4 sm:p-6 lg:p-8">
    <div class="max-w-md w-full bg-white rounded-2xl shadow-googleCard border border-gray-200 overflow-hidden">
      
      <!-- Card Header Banner -->
      <div class="bg-gradient-to-r from-blue-600 to-indigo-700 p-6 text-white text-center">
        <div class="w-12 h-12 bg-white/20 backdrop-blur-sm rounded-2xl flex items-center justify-center mx-auto mb-3 shadow-inner">
          <span class="text-2xl">⚡</span>
        </div>
        <h1 class="text-xl font-bold font-google tracking-tight text-white">Welcome to PlugMate</h1>
        <p class="text-xs text-blue-100 mt-1">Community EV Charger Sharing Network</p>
      </div>

      <!-- Clerk SSO Portal Link -->
      <div class="p-4 bg-indigo-50/70 border-b border-indigo-100 flex items-center justify-between text-xs">
        <div class="flex items-center gap-2">
          <span class="text-lg">🔐</span>
          <div>
            <span class="font-bold text-gray-900 block leading-tight">Clerk Authentication Portal</span>
            <span class="text-[11px] text-gray-500">Sign in with email verification or social login</span>
          </div>
        </div>
        <a href="http://localhost:5173" class="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-lg text-[11px] shadow-sm transition-colors whitespace-nowrap">
          Open Clerk →
        </a>
      </div>

      <!-- Custom Auth Form -->
      <div class="p-6">
        <div class="flex items-center justify-center gap-4 mb-4 text-xs font-medium border-b border-gray-100 pb-3">
          <button id="tabLogin" onclick="switchAuthTab('login')" class="text-googleBlue font-bold border-b-2 border-googleBlue pb-1">
            Sign In
          </button>
          <button id="tabSignup" onclick="switchAuthTab('signup')" class="text-gray-500 hover:text-gray-800 pb-1">
            Create Account
          </button>
        </div>

        <form id="authForm" onsubmit="handleAuthSubmit(event)" class="space-y-3.5">
          
          <!-- Role Selector -->
          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1.5">I want to:</label>
            <div class="grid grid-cols-2 gap-2">
              <label class="border rounded-xl p-2.5 text-center cursor-pointer transition-all flex flex-col items-center gap-1 border-googleBlue bg-blue-50/50" id="roleLabelChargee">
                <input type="radio" name="authRole" value="chargee" checked onchange="updateRoleUi()" class="sr-only">
                <span class="text-lg">🚗</span>
                <span class="text-xs font-bold text-gray-900">Chargee</span>
                <span class="text-[10px] text-gray-500">Rent a charger</span>
              </label>

              <label class="border rounded-xl p-2.5 text-center cursor-pointer transition-all flex flex-col items-center gap-1 border-gray-200 hover:border-gray-300" id="roleLabelHost">
                <input type="radio" name="authRole" value="host" onchange="updateRoleUi()" class="sr-only">
                <span class="text-lg">⚡</span>
                <span class="text-xs font-bold text-gray-900">Host</span>
                <span class="text-[10px] text-gray-500">Share driveway</span>
              </label>
            </div>
          </div>

          <!-- Name Field (for signup) -->
          <div id="nameFieldGroup" class="hidden">
            <label class="block text-xs font-medium text-gray-700 mb-1">Full Name</label>
            <input type="text" id="authName" placeholder="e.g. Jaspreet Singh" class="w-full text-xs px-3.5 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:border-googleBlue">
          </div>

          <!-- Email Field -->
          <div>
            <label class="block text-xs font-medium text-gray-700 mb-1">Email Address</label>
            <input type="email" id="authEmail" required placeholder="name@domain.com" value="aman@plugmate.io" class="w-full text-xs px-3.5 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:border-googleBlue">
          </div>

          <!-- Phone Number -->
          <div>
            <label class="block text-xs font-medium text-gray-700 mb-1">Phone Number</label>
            <input type="tel" id="authPhone" placeholder="+91 98888 00000" value="+91 98888 12345" class="w-full text-xs px-3.5 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:border-googleBlue">
          </div>

          <!-- Vehicle Info (Chargee Only) -->
          <div id="vehicleFieldGroup">
            <label class="block text-xs font-medium text-gray-700 mb-1">EV Vehicle Model (Optional)</label>
            <input type="text" id="authVehicle" placeholder="e.g. Tata Nexon EV, MG Comet, Ather" value="Tata Nexon EV (EV-DRIVE-2026)" class="w-full text-xs px-3.5 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:border-googleBlue">
          </div>

          <button type="submit" id="btnSubmitAuth" class="w-full py-2.5 bg-googleBlue hover:bg-googleBlueHover text-white text-xs font-bold rounded-full shadow-google transition-colors">
            Continue to PlugMate →
          </button>
        </form>

      </div>

      <!-- Trust Footer -->
      <div class="p-3 bg-gray-50 border-t border-gray-200 text-center text-[11px] text-gray-500">
        🛡️ PlugMate Secure Community Driveway Platform
      </div>

    </div>
  </main>

  <script src="js/data.js"></script>
  <script src="js/location-cookie.js"></script>
  <script src="js/navbar.js"></script>
  <script>
    let currentTab = 'login';

    document.addEventListener('DOMContentLoaded', () => {
      renderVoltNavbar('login');
    });

    function switchAuthTab(tab) {
      currentTab = tab;
      const tabLogin = document.getElementById('tabLogin');
      const tabSignup = document.getElementById('tabSignup');
      const nameGroup = document.getElementById('nameFieldGroup');
      const btnSubmit = document.getElementById('btnSubmitAuth');

      if (tab === 'login') {
        tabLogin.className = 'text-googleBlue font-bold border-b-2 border-googleBlue pb-1';
        tabSignup.className = 'text-gray-500 hover:text-gray-800 pb-1';
        nameGroup.classList.add('hidden');
        btnSubmit.textContent = 'Sign In to PlugMate →';
      } else {
        tabSignup.className = 'text-googleBlue font-bold border-b-2 border-googleBlue pb-1';
        tabLogin.className = 'text-gray-500 hover:text-gray-800 pb-1';
        nameGroup.classList.remove('hidden');
        btnSubmit.textContent = 'Create Community Account →';
      }
    }

    function updateRoleUi() {
      const role = document.querySelector('input[name="authRole"]:checked').value;
      const labelChargee = document.getElementById('roleLabelChargee');
      const labelHost = document.getElementById('roleLabelHost');
      const vehicleGroup = document.getElementById('vehicleFieldGroup');

      if (role === 'chargee') {
        labelChargee.className = 'border rounded-xl p-2.5 text-center cursor-pointer transition-all flex flex-col items-center gap-1 border-googleBlue bg-blue-50/50';
        labelHost.className = 'border rounded-xl p-2.5 text-center cursor-pointer transition-all flex flex-col items-center gap-1 border-gray-200 hover:border-gray-300';
        if (vehicleGroup) vehicleGroup.classList.remove('hidden');
      } else {
        labelHost.className = 'border rounded-xl p-2.5 text-center cursor-pointer transition-all flex flex-col items-center gap-1 border-emerald-600 bg-emerald-50/50';
        labelChargee.className = 'border rounded-xl p-2.5 text-center cursor-pointer transition-all flex flex-col items-center gap-1 border-gray-200 hover:border-gray-300';
        if (vehicleGroup) vehicleGroup.classList.add('hidden');
      }
    }

    function handleAuthSubmit(e) {
      e.preventDefault();
      const role = document.querySelector('input[name="authRole"]:checked').value;
      const email = document.getElementById('authEmail').value.trim();
      const name = document.getElementById('authName').value.trim() || email.split('@')[0];
      const phone = document.getElementById('authPhone').value.trim();
      const vehicleName = document.getElementById('authVehicle').value.trim();

      const user = VoltData.loginOrSignup(name, email, role, phone, vehicleName ? {
        make: vehicleName.split(' ')[0] || 'EV',
        model: vehicleName,
        reg_no: 'EV-USER',
        connector: 'Type-2 AC',
        battery_kwh: 40.0
      } : null);

      showToast(`Signed in as ${user.name}`);
      setTimeout(() => {
        if (user.role === 'host') {
          window.location.href = 'host-dashboard.html';
        } else {
          window.location.href = 'map.html';
        }
      }, 500);
    }
  </script>
</body>
</html>
