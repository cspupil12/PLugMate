<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PlugMate — Rate Your Charging Session</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&family=Google+Sans:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Roboto', 'Google Sans', 'sans-serif'],
            google: ['Google Sans', 'Roboto', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            googleBlue: '#1A73E8',
            googleBlueHover: '#1557B0',
            googleRed: '#EA4335',
            googleGreen: '#0F9D58',
            googleYellow: '#FBBC04',
            googleGray: '#5F6368',
            googleBorder: '#DADCE0'
          },
          boxShadow: {
            google: '0 2px 6px rgba(60,64,67, 0.3), 0 1px 2px rgba(60,64,67, 0.15)',
            googleCard: '0 4px 16px rgba(0,0,0,0.12)'
          }
        }
      }
    }
  </script>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="css/style.css">
  <!-- Dynamic Environment Config (safe public keys only) -->
  <script src="/js/config.js"></script>
  <!-- Clerk JavaScript SDK -->
  <script async crossorigin="anonymous" src="https://cdn.jsdelivr.net/npm/@clerk/clerk-js@latest/dist/clerk.browser.js"></script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col font-sans text-gray-800">

  <!-- Shared Navbar Mount -->
  <div id="voltNavbarMount"></div>

  <main class="flex-1 max-w-xl w-full mx-auto p-4 sm:p-6 lg:p-8 flex items-center justify-center">
    
    <div class="w-full bg-white rounded-2xl shadow-googleCard border border-gray-200 overflow-hidden">
      
      <!-- Card Header Banner -->
      <div class="bg-gradient-to-r from-amber-500 to-amber-600 p-6 text-white text-center">
        <div class="w-12 h-12 bg-white/20 backdrop-blur-sm rounded-full flex items-center justify-center mx-auto text-2xl mb-2">
          ★
        </div>
        <h1 class="text-xl font-bold font-google">Rate Your Charging Experience</h1>
        <p class="text-xs text-amber-100 mt-1">
          Help neighbors discover verified, reliable driveway hosts
        </p>
      </div>

      <!-- Booking Session Summary -->
      <div class="p-5 bg-amber-50/50 border-b border-amber-100 flex items-center justify-between text-xs">
        <div>
          <span class="text-[10px] uppercase font-bold text-amber-800 block">Completed Session</span>
          <h2 class="font-bold text-gray-900" id="revChargerTitle">Green Park Wallbox</h2>
          <p class="text-gray-500" id="revHostDetails">Hosted by Verified Host</p>
        </div>
        <span class="font-mono font-bold text-xs bg-white px-2.5 py-1 rounded-full border border-amber-200 text-gray-700" id="revBookingId">
          PM-0000
        </span>
      </div>

      <!-- Form -->
      <form onsubmit="handleSubmitReview(event)" class="p-6 space-y-5">
        
        <!-- Interactive 5 Star Selector -->
        <div class="text-center space-y-2">
          <label class="block text-xs font-bold text-gray-700">Tap to Rate Host & Charger</label>
          <div class="flex items-center justify-center gap-2 select-none" id="starContainer">
            <button type="button" onclick="setRating(1)" onmouseover="hoverRating(1)" onmouseout="resetHoverRating()" class="star-btn active" id="star-1">★</button>
            <button type="button" onclick="setRating(2)" onmouseover="hoverRating(2)" onmouseout="resetHoverRating()" class="star-btn active" id="star-2">★</button>
            <button type="button" onclick="setRating(3)" onmouseover="hoverRating(3)" onmouseout="resetHoverRating()" class="star-btn active" id="star-3">★</button>
            <button type="button" onclick="setRating(4)" onmouseover="hoverRating(4)" onmouseout="resetHoverRating()" class="star-btn active" id="star-4">★</button>
            <button type="button" onclick="setRating(5)" onmouseover="hoverRating(5)" onmouseout="resetHoverRating()" class="star-btn active" id="star-5">★</button>
          </div>
          <div class="text-xs font-bold text-amber-600 font-google" id="ratingLabel">
            5 Stars — Outstanding Experience!
          </div>
        </div>

        <!-- Tag Chips -->
        <div>
          <label class="block text-xs font-bold text-gray-700 mb-2">What went well? (Select all that apply)</label>
          <div class="flex flex-wrap gap-1.5" id="tagsContainer">
            <button type="button" onclick="toggleTag(this, 'Fast charging')" class="tag-chip px-3 py-1.5 rounded-full text-xs font-medium border border-gray-200 text-gray-600 hover:border-gray-300">
              ⚡ Fast charging
            </button>
            <button type="button" onclick="toggleTag(this, 'Clean driveway')" class="tag-chip px-3 py-1.5 rounded-full text-xs font-medium border border-gray-200 text-gray-600 hover:border-gray-300">
              🏡 Clean driveway
            </button>
            <button type="button" onclick="toggleTag(this, 'Friendly host')" class="tag-chip px-3 py-1.5 rounded-full text-xs font-medium border border-gray-200 text-gray-600 hover:border-gray-300">
              🤝 Friendly host
            </button>
            <button type="button" onclick="toggleTag(this, 'Safe at night')" class="tag-chip px-3 py-1.5 rounded-full text-xs font-medium border border-gray-200 text-gray-600 hover:border-gray-300">
              🌙 Safe at night
            </button>
            <button type="button" onclick="toggleTag(this, 'Easy access')" class="tag-chip px-3 py-1.5 rounded-full text-xs font-medium border border-gray-200 text-gray-600 hover:border-gray-300">
              🚗 Easy access
            </button>
            <button type="button" onclick="toggleTag(this, 'Solar powered')" class="tag-chip px-3 py-1.5 rounded-full text-xs font-medium border border-gray-200 text-gray-600 hover:border-gray-300">
              ☀️ Solar powered
            </button>
          </div>
        </div>

        <!-- Feedback Comments -->
        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1">Write your review</label>
          <textarea id="reviewComment" rows="3" required placeholder="Share details of your experience: driveway accessibility, host hospitality, electricity stability..." class="w-full text-xs p-3 border border-gray-300 rounded-xl focus:outline-none focus:border-googleBlue resize-none"></textarea>
        </div>

        <!-- Submit Button -->
        <div class="pt-2 flex items-center gap-3">
          <a href="my-bookings.html" class="w-1/3 py-2.5 border border-gray-300 hover:bg-gray-50 text-gray-700 text-xs font-bold rounded-full transition-colors text-center">
            Cancel
          </a>
          <button type="submit" class="flex-1 py-2.5 bg-amber-500 hover:bg-amber-600 text-white text-xs font-bold rounded-full shadow-google transition-colors flex items-center justify-center gap-1.5">
            <span>★</span> Submit Community Review
          </button>
        </div>

      </form>

    </div>

  </main>

  <script src="js/data.js"></script>
  <script src="js/location-cookie.js"></script>
  <script src="js/navbar.js"></script>
  <script>
    let currentRating = 5;
    let selectedTags = [];
    let bookingId = '';
    let chargerId = 1;

    const RATING_TEXTS = {
      1: "1 Star — Poor Experience",
      2: "2 Stars — Needs Improvement",
      3: "3 Stars — Decent / Average",
      4: "4 Stars — Very Good Charging",
      5: "5 Stars — Outstanding Experience!"
    };

    document.addEventListener('DOMContentLoaded', () => {
      renderVoltNavbar('bookings');

      const urlParams = new URLSearchParams(window.location.search);
      bookingId = urlParams.get('bookingId') || 'VS-LDH-8921';
      chargerId = urlParams.get('chargerId') || 1;

      const booking = VoltData.getBookingById(bookingId);
      const charger = VoltData.getChargerById(chargerId);

      if (booking) {
        document.getElementById('revBookingId').textContent = booking.id;
        document.getElementById('revChargerTitle').textContent = booking.charger_title;
        document.getElementById('revHostDetails').textContent = `Hosted by ${booking.host_name} • ${booking.date}`;
        chargerId = booking.charger_id;
      } else if (charger) {
        document.getElementById('revChargerTitle').textContent = charger.title;
        document.getElementById('revHostDetails').textContent = `Hosted by ${charger.host_name} • Verified Host`;
      }

      setRating(5);
    });

    function setRating(rating) {
      currentRating = rating;
      updateStarsUi(rating);
      document.getElementById('ratingLabel').textContent = RATING_TEXTS[rating];
    }

    function hoverRating(rating) {
      updateStarsUi(rating);
      document.getElementById('ratingLabel').textContent = RATING_TEXTS[rating];
    }

    function resetHoverRating() {
      updateStarsUi(currentRating);
      document.getElementById('ratingLabel').textContent = RATING_TEXTS[currentRating];
    }

    function updateStarsUi(count) {
      for (let i = 1; i <= 5; i++) {
        const star = document.getElementById(`star-${i}`);
        if (i <= count) {
          star.classList.add('active');
        } else {
          star.classList.remove('active');
        }
      }
    }

    function toggleTag(button, tag) {
      const idx = selectedTags.indexOf(tag);
      if (idx !== -1) {
        selectedTags.splice(idx, 1);
        button.className = 'tag-chip px-3 py-1.5 rounded-full text-xs font-medium border border-gray-200 text-gray-600 hover:border-gray-300';
      } else {
        selectedTags.push(tag);
        button.className = 'tag-chip px-3 py-1.5 rounded-full text-xs font-bold border border-amber-500 bg-amber-50 text-amber-800';
      }
    }

    function handleSubmitReview(e) {
      e.preventDefault();
      const comment = document.getElementById('reviewComment').value.trim();
      if (!comment) return;

      VoltData.addReview(bookingId, chargerId, currentRating, comment, selectedTags);
      showToast("Thank you! Review published to community.", "★");

      setTimeout(() => {
        window.location.href = 'my-bookings.html';
      }, 700);
    }
  </script>
</body>
</html>
